<style>
/* Layout: a darkroom bench. Slim tool rail on the left, work surface in the middle, tabbed panels on the right. */
:root{
  --bg:#14120f; --panel:#1b1916; --panel-2:#24211d; --hover:#2d2924; --line:#37332e;
  --fg:#ece8e1; --muted:#9d968b; --accent:#ff6b3d; --accent-fg:#1c0c05; --accent-soft:rgba(255,107,61,.16);
  --bench:#0d0c0a; --check-a:#2a2723; --check-b:#35312c; --danger:#ff5d5d;
  --font-ui:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#ebe8e2; --panel:#f6f4f0; --panel-2:#ffffff; --hover:#ece8e0; --line:#d3cec5;
    --fg:#1d1b18; --muted:#6b655b; --accent:#d4430f; --accent-fg:#ffffff; --accent-soft:rgba(212,67,15,.12);
    --bench:#d9d5cc; --check-a:#e6e2da; --check-b:#f3f1ec; --danger:#c62828; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#ebe8e2; --panel:#f6f4f0; --panel-2:#ffffff; --hover:#ece8e0; --line:#d3cec5;
  --fg:#1d1b18; --muted:#6b655b; --accent:#d4430f; --accent-fg:#ffffff; --accent-soft:rgba(212,67,15,.12);
  --bench:#d9d5cc; --check-a:#e6e2da; --check-b:#f3f1ec; --danger:#c62828; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num,output,.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;gap:8px;min-width:0;
  grid-template-columns:48px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "tools stage side"}
.top{grid-area:top;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.grp{display:flex;gap:4px;align-items:center}
.spacer{flex:1}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-height:30px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 8px;min-height:26px;font-size:12px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--danger)}

.tools{grid-area:tools;display:flex;flex-direction:column;gap:2px;align-items:center;overflow-y:auto;padding:4px 0;
  background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tool{width:36px;height:34px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none}
.tool:hover{background:var(--hover);color:var(--fg)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sep{width:26px;height:1px;background:var(--line);margin:4px 0;flex:none}
.swatches{position:relative;width:36px;height:40px;flex:none;margin-top:2px}
.swatches input{position:absolute;width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
.swatches #fg{left:2px;top:2px;z-index:2}.swatches #bg{left:12px;top:14px}
.swatches button{position:absolute;right:0;top:-2px;border:0;background:none;color:var(--muted);font-size:11px;padding:0}

.stage-wrap{grid-area:stage;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:34px;padding:3px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px}
.opts label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.opts input[type=range]{width:96px}
.opts .hint{color:var(--muted)}
.opts select,.opts input[type=number]{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.stage{flex:1;min-height:0;overflow:auto;display:flex;padding:12px;background:var(--bench);border:1px solid var(--line);border-radius:10px;position:relative}
.board{position:relative;margin:auto;flex:none;box-shadow:0 8px 40px rgba(0,0,0,.45)}
.board canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#cv{background-image:conic-gradient(var(--check-a) 25%,var(--check-b) 0 50%,var(--check-a) 0 75%,var(--check-b) 0);background-size:16px 16px}
#ov{touch-action:none}
.status{display:flex;gap:14px;color:var(--muted);font-size:11px;min-height:16px;flex-wrap:wrap}
.drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;pointer-events:none}

.side{grid-area:side;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{flex:1;background:none;border:0;padding:9px 6px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.panel{flex:1;min-height:0;overflow:auto;padding:10px}
.panel h4{margin:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.panel h4:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.row select,.row input[type=text],.row input[type=number],.panel textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
.row select{flex:1}
.panel textarea{width:100%;min-height:64px;resize:vertical}
.sl{display:grid;grid-template-columns:78px 1fr 46px;gap:8px;align-items:center;margin-bottom:4px}
.sl span{color:var(--muted);font-size:12px}
.sl output{text-align:right;font-size:11px}
input[type=range]{accent-color:var(--accent);min-width:0;width:100%}
input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.chip:hover{border-color:var(--accent)}
.layers{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.layer{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px;border:1px solid transparent;border-radius:6px;background:var(--panel-2)}
.layer:hover{border-color:var(--line)}
.layer.sel{border-color:var(--accent);background:var(--accent-soft)}
.layer.hidden-l .nm{opacity:.45}
.layer.over{outline:1px dashed var(--accent)}
.th{width:40px;height:30px;border-radius:3px;background-image:conic-gradient(var(--check-a) 25%,var(--check-b) 0 50%,var(--check-a) 0 75%,var(--check-b) 0);background-size:8px 8px;display:block}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nm small{display:block;color:var(--muted);font-size:10px}
.lbtns{display:flex;gap:2px}
.ib{width:24px;height:24px;border:0;background:none;border-radius:4px;color:var(--muted);font-size:13px;line-height:1;padding:0}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib.on{color:var(--accent)}
.mth{width:24px;height:24px;border:1px solid var(--line);border-radius:3px;padding:0;background-size:cover}
.mth.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hist button{width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:5px 8px;color:var(--muted)}
.hist button:hover{background:var(--hover);color:var(--fg)}
.hist .cur button{background:var(--accent-soft);color:var(--accent)}
.hist .fut button{opacity:.5}
.note{color:var(--muted);font-size:12px;margin:6px 0}
.empty{color:var(--muted);padding:12px 4px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(460px,100%);max-height:92%;overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 12px;font-size:16px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.dlg .preview{max-width:100%;max-height:220px;display:block;margin:8px auto;border-radius:6px;background-image:conic-gradient(var(--check-a) 25%,var(--check-b) 0 50%,var(--check-a) 0 75%,var(--check-b) 0);background-size:12px 12px}
.menu{position:fixed;z-index:45;min-width:228px;max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;justify-content:space-between;gap:18px;background:none;border:0;padding:6px 10px;border-radius:5px;text-align:left}
.menu button:hover:not(:disabled){background:var(--hover)}.menu button:disabled{opacity:.4;cursor:default}
.menu .k{color:var(--muted);font-size:11px;font-family:var(--font-num)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.hist-cv{width:100%;height:84px;display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.swgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:8px}.swgrid button{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;padding:0}
.kbd{display:grid;grid-template-columns:1fr auto;gap:2px 18px;font-size:12px}.kbd span:nth-child(even){font-family:var(--font-num);color:var(--muted);text-align:right}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:50;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto 60vh;
    grid-template-areas:"top" "stage" "tools" "side"}
  .tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px}
  .sep{width:1px;height:26px;margin:0 4px}
  .swatches{margin:0 4px}
  .stage-wrap{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand"><span class="dot"></span>Grainroom <small style="font-weight:500;opacity:.7;font-size:11px">Pro</small></div>
    <div class="grp">
      <button class="btn" id="bOpen" title="Open a photo (Ctrl+O)">Open</button>
      <button class="btn" id="bNew" title="New blank document">New</button>
      <button class="btn" id="bAdd" title="Add a photo as a new layer">Add image</button>
    </div>
    <div class="grp">
      <button class="btn" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">Undo</button>
      <button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">Redo</button>
    </div>
    <div class="grp"><button class="btn" id="bSize" title="Image and canvas size">Size</button></div>
    <div class="grp">
      <button class="btn" id="mEdit" aria-haspopup="menu">Edit &#9662;</button><button class="btn" id="mSel" aria-haspopup="menu">Select &#9662;</button>
      <button class="btn" id="mImg" aria-haspopup="menu">Image &#9662;</button><button class="btn" id="mFilter" aria-haspopup="menu">Filter &#9662;</button><button class="btn" id="mView" aria-haspopup="menu">View &#9662;</button>
    </div>
    <div class="grp">
      <button class="btn" id="zOut" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
      <button class="btn num" id="zVal" title="Zoom to 100%" style="min-width:58px">100%</button>
      <button class="btn" id="zIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button class="btn" id="zFit" title="Fit to screen (0)">Fit</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="bCompare" title="Hold to see the original (\)">Compare</button>
    <button class="btn" id="bSave" title="Save project file (Ctrl+S)">Save</button>
    <button class="btn" id="bHelp" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
    <button class="btn" id="bTheme" aria-label="Toggle light and dark theme" title="Toggle theme">Theme</button>
    <button class="btn primary" id="bExport" title="Export (Ctrl+E)">Export</button>

  <nav class="tools" id="tools" aria-label="Tools"></nav>
  <section class="stage-wrap">
    <div class="opts" id="opts"></div>
    <div class="stage" id="stage">
      <div class="board" id="board"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
      <div class="drop" id="drop" hidden>Drop a photo to open it</div>
    </div>
    <div class="status mono" id="status"></div>
  </section>
  <aside class="side">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="layers">Layers</button>
      <button class="tab" role="tab" data-tab="adjust">Adjust</button>
      <button class="tab" role="tab" data-tab="style">Style</button>
      <button class="tab" role="tab" data-tab="color">Colour</button>
      <button class="tab" role="tab" data-tab="assets">Assets</button>
      <button class="tab" role="tab" data-tab="history">History</button>
    </div>
    <div class="panel" id="panel"></div>
  </aside>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="file" accept="image/*,.grainroom" hidden>

/* ---------- export ---------- */
async function saveBlob(blob,name){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch{dl=null}
  if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name);return true}catch(e){if(e&&e.code==='declined')return false;if(e&&(e.code==='too_large'))toast('File too large. Try a smaller scale or JPEG.')}}
  if(!dl){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Download started')}
  return true}
function exportDialog(){
  if(!S.layers.length){toast('Nothing to export yet');return}
  const st={fmt:'png',q:90,scale:100,name:'grainroom-export',blob:null,url:null};
  const close=modal('Export',`<div class="row"><label>Format <select id="xf"><option value="png">PNG (lossless, keeps transparency)</option><option value="jpeg">JPEG (smaller, no transparency)</option><option value="webp">WebP (small, modern)</option></select></label></div>
  <div class="row" id="xqr"><label style="flex:1;display:flex;gap:8px;align-items:center">Quality <input id="xq" type="range" min="40" max="100" value="90"><output id="xqo">90</output></label></div>
  <div class="row"><label>Scale <select id="xs"><option value="50">50%</option><option value="100" selected>100%</option><option value="200">200%</option></select></label><label>Name <input id="xn" type="text" value="${st.name}" style="width:150px"></label></div>
  <img class="preview" id="xp" alt="Export preview" hidden><p class="note mono" id="xi">Rendering…</p><p class="note" id="xh" hidden>If saving is blocked here, press and hold or right-click the preview to save it.</p>`,
  [{label:'Close'},{label:'Copy image',onClick:async()=>{try{const base=mkCanvas(S.w,S.h);composeLayers(base.getContext('2d'),S.w,S.h,S.layers);const b=await toBlobP(base);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Copied to clipboard')}catch{toast('Clipboard is not available here')}return false}},...(navigator.share?[{label:'Share',onClick:async()=>{if(!st.blob)return false;try{const ext=st.fmt==='jpeg'?'jpg':st.fmt,f=new File([st.blob],(st.name||'grainroom-export')+'.'+ext,{type:st.blob.type});if(navigator.canShare&&!navigator.canShare({files:[f]})){toast('Sharing files is not supported here');return false}await navigator.share({files:[f],title:'Made with Grainroom'})}catch{}return false}}]:[]),{label:'Save file',primary:true,onClick:async m=>{if(!st.blob)return false;const ext=st.fmt==='jpeg'?'jpg':st.fmt;const nm=(st.name||'grainroom-export').replace(/[\\/:*?"<>|]+/g,'-');await saveBlob(st.blob,nm+'.'+ext);return false}}],
  m=>{const f=m.querySelector('#xf'),q=m.querySelector('#xq'),s=m.querySelector('#xs'),n=m.querySelector('#xn'),qr=m.querySelector('#xqr');let tick=0;
    async function build(){const my=++tick;st.fmt=f.value;st.q=+q.value;st.scale=+s.value;st.name=n.value;qr.hidden=st.fmt==='png';m.querySelector('#xqo').textContent=q.value;
      const w=Math.round(S.w*st.scale/100),h=Math.round(S.h*st.scale/100);
      if(w*h>36e6){m.querySelector('#xi').textContent='That scale is too large. Choose a smaller one.';st.blob=null;return}
      const base=mkCanvas(S.w,S.h);composeLayers(base.getContext('2d'),S.w,S.h,S.layers);
      const out=mkCanvas(w,h),g=out.getContext('2d');if(st.fmt==='jpeg'){g.fillStyle='#fff';g.fillRect(0,0,w,h)}g.imageSmoothingQuality='high';g.drawImage(base,0,0,w,h);
      const blob=await new Promise(r=>out.toBlob(r,'image/'+st.fmt,st.q/100));if(my!==tick)return;
      if(!blob){m.querySelector('#xi').textContent='This browser cannot create that format. Pick PNG or JPEG.';st.blob=null;return}
      st.blob=blob;if(st.url)URL.revokeObjectURL(st.url);st.url=URL.createObjectURL(blob);const p=m.querySelector('#xp');p.src=st.url;p.hidden=false;
      m.querySelector('#xi').textContent=`${w} × ${h} px · ${blob.size>1048576?(blob.size/1048576).toFixed(2)+' MB':Math.round(blob.size/1024)+' KB'}`}
    [f,q,s].forEach(x=>x.addEventListener('input',build));n.addEventListener('input',()=>{st.name=n.value});build();
    (async()=>{let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch{}if(!dl)m.querySelector('#xh').hidden=false})()});
  return close}

/* ---------- project files, autosave ---------- */
const toBlobP=c=>new Promise(r=>c.toBlob(r,'image/png'));
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function blobToCanvas(b){const bm=await createImageBitmap(b),c=mkCanvas(bm.width,bm.height);c.getContext('2d').drawImage(bm,0,0);return c}
async function serializeDoc(){const layers=[];
  for(const L of S.layers){const m=ser(L),o={...m};delete o.canvas;delete o.mask;o.canvasBlob=await toBlobP(m.canvas);o.maskBlob=m.mask?await toBlobP(m.mask):null;layers.push(o)}
  return{v:1,w:S.w,h:S.h,active:S.active,layers}}
async function saveProject(){
  if(!S.layers.length){toast('Nothing to save yet');return}
  toast('Saving project…');const d=await serializeDoc();
  for(const l of d.layers){l.canvasBlob=await blobToDataURL(l.canvasBlob);if(l.maskBlob)l.maskBlob=await blobToDataURL(l.maskBlob)}
  await saveBlob(new Blob([JSON.stringify(d)],{type:'application/json'}),'project.grainroom')}
async function loadDoc(d){
  const layers=[];let maxId=0;
  for(const m of d.layers){let cb=m.canvasBlob,mb=m.maskBlob;if(typeof cb==='string')cb=await(await fetch(cb)).blob();if(typeof mb==='string')mb=await(await fetch(mb)).blob();
    const canvas=await blobToCanvas(cb),mask=mb?await blobToCanvas(mb):null,o={...m,canvas,mask};delete o.canvasBlob;delete o.maskBlob;
    layers.push(wrapLayer({...o,dirty:true,cache:null,preview:null}));maxId=Math.max(maxId,m.id||0)}
  uid=Math.max(uid,maxId+1);resetDoc(d.w,d.h,layers);if(byId(d.active)){S.active=d.active;renderPanel();renderOpts()}}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('grainroom',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function queueAutosave(){if(S.noAuto||S.hi<1||!window.indexedDB)return;clearTimeout(S.asT);S.asT=setTimeout(async()=>{try{const d=await serializeDoc();d.ts=Date.now();await idbSet('doc',d)}catch{}},3000)}
async function checkRestore(){
  try{const d=await idbGet('doc');if(!d||!d.layers||!d.layers.length)return;S.noAuto=true;
    modal('Restore your last session?',`<p class="note">Autosaved ${esc(new Date(d.ts).toLocaleString())}: ${d.w} × ${d.h} px, ${d.layers.length} layer${d.layers.length>1?'s':''}. Everything stays on this device.</p>`,
      [{label:'Start fresh',onClick:()=>{idbDel('doc').catch(()=>{})}},{label:'Restore',primary:true,onClick:async()=>{try{await loadDoc(d);toast('Session restored')}catch{toast('Could not restore that session')}}}],
      ()=>{S.mc=()=>{S.noAuto=false}})}catch{}}

/* ---------- sample scene (marked as an example) ---------- */
function makeSample(){
  const W=1600,H=1000,c=mkCanvas(W,H),g=c.getContext('2d');let s=7;const rnd=()=>{s=(s*16807)%2147483647;return(s-1)/2147483646},hz=H*.62;
  const sky=g.createLinearGradient(0,0,0,hz);sky.addColorStop(0,'#1c2848');sky.addColorStop(.45,'#7a4a6c');sky.addColorStop(.82,'#f08a4b');sky.addColorStop(1,'#ffd08a');g.fillStyle=sky;g.fillRect(0,0,W,H);
  const sx=1020,sy=hz-10,gl=g.createRadialGradient(sx,sy,10,sx,sy,460);gl.addColorStop(0,'rgba(255,236,190,.95)');gl.addColorStop(.25,'rgba(255,190,120,.45)');gl.addColorStop(1,'rgba(255,150,90,0)');g.fillStyle=gl;g.fillRect(0,0,W,hz);
  g.fillStyle='#fff3d2';g.beginPath();g.arc(sx,sy,52,0,7);g.fill();
  for(let i=0;i<16;i++){g.fillStyle=`rgba(255,${170+rnd()*60|0},${140+rnd()*60|0},${.07+rnd()*.12})`;g.beginPath();g.ellipse(rnd()*W,100+rnd()*340,150+rnd()*280,7+rnd()*15,0,0,7);g.fill()}
  const ridge=(base,amp,col,seed,f)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,hz);for(let x=0;x<=W;x+=8){const y=base-amp*(.5+.5*Math.sin(x*f+seed)+.35*Math.sin(x*f*2.7+seed*2)+.15*Math.sin(x*f*6+seed*3));g.lineTo(x,y)}g.lineTo(W,hz);g.closePath();g.fill()};
  ridge(hz-40,150,'#7a4f78',1,.004);ridge(hz-20,120,'#52386a',4,.006);ridge(hz-5,80,'#33264e',9,.009);
  const sea=g.createLinearGradient(0,hz,0,H);sea.addColorStop(0,'#e78f5c');sea.addColorStop(.25,'#6a4468');sea.addColorStop(1,'#141a33');g.fillStyle=sea;g.fillRect(0,hz,W,H-hz);
  for(let y=hz+4;y<H;y+=5){const k=(y-hz)/(H-hz),w=40+k*340*rnd(),a=(1-k)*.55*rnd();g.fillStyle=`rgba(255,226,170,${a})`;g.fillRect(sx-w/2+(rnd()-.5)*60,y,w,2)}
  g.fillStyle='#0d0c18';g.beginPath();g.moveTo(0,H);g.lineTo(0,H-250);for(let x=0;x<=520;x+=10)g.lineTo(x,H-250+x*.18-Math.sin(x*.05)*30-rnd()*22);g.lineTo(620,H);g.closePath();g.fill();
  const id=g.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*14;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);return c}
function startSample(){
  const L=newLayer('image','Sample scene (example)',makeSample());resetDoc(1600,1000,[L]);
  const T=newLayer('text','Harbour at dusk',mkCanvas(8,8));T.text={content:'Harbour at dusk',font:"'Playfair Display',serif",size:96,color:'#fff4e0',bold:true,italic:true,align:'left',stroke:0,strokeColor:'#000000'};
  renderText(T);T.x=70+T.canvas.width/2;T.y=830+T.canvas.height/2;T.shadow={on:true,x:4,y:6,blur:18,color:'#000000',alpha:.55};insertLayer(T);S.active=L.id;commit('Add text');renderPanel();

$('#bOpen').onclick=()=>pickFile(false);$('#bAdd').onclick=()=>pickFile(true);$('#bNew').onclick=newDialog;$('#bSize').onclick=sizeDialog;$('#bExport').onclick=exportDialog;

document.addEventListener('keydown',e=>{
  const tg=e.target,typing=tg&&(tg.tagName==='INPUT'&&!['range','checkbox','color'].includes(tg.type)||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT');
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==='o'){e.preventDefault();pickFile(false);return}
  if(mod&&e.key.toLowerCase()==='e'){e.preventDefault();exportDialog();return}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return}
  if(mod&&e.key==='\''){e.preventDefault();S.grid=!S.grid;drawOverlay();return}
  if(mod&&e.key.toLowerCase()==='d'&&!typing){e.preventDefault();e.shiftKey?reselect():deselect();return}
  if(mod&&e.key.toLowerCase()==='a'&&!typing){e.preventDefault();selectAll();return}
  if(mod&&e.key.toLowerCase()==='c'&&!typing&&!getSelection().toString()){e.preventDefault();copySel(false);return}
  if(mod&&e.key.toLowerCase()==='x'&&!typing){e.preventDefault();copySel(true);return}
  if(mod&&e.key.toLowerCase()==='j'&&!typing){e.preventDefault();if(S.sel)layerViaCopy(e.shiftKey);else dupLayer();return}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==='n'&&!typing){e.preventDefault();addPaintLayer();return}
  if(mod&&e.key.toLowerCase()==='t'&&!typing){e.preventDefault();setTool('transform');return}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==='i'&&!typing){e.preventDefault();invertSel();return}
  if(typing)return;
  if(e.key===' '){S.space=true;ov.style.cursor='grab';e.preventDefault();return}
  if(e.key==='Enter'&&S.tool==='crop'){applyCrop();return}
  if(e.key==='Enter'&&S.tool==='transform'){setTool('move');return}
  if(e.key==='Escape'){if(S.tool==='crop'||S.tool==='transform')setTool('move');else if(S.sel){deselect()}return}
  if((e.key==='Backspace'||e.key==='Delete')&&(e.altKey||mod)&&S.sel){e.preventDefault();selAction(mod?'fillbg':'fill');return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();if(S.sel)selAction('clear');else delLayer();return}
  if(e.key.startsWith('Arrow')&&S.tool==='move'){const L=activeLayer();if(L&&!L.locked&&L.type!=='adjust'){e.preventDefault();const d=e.shiftKey?10:1;
    if(e.key==='ArrowLeft')L.x-=d;if(e.key==='ArrowRight')L.x+=d;if(e.key==='ArrowUp')L.y-=d;if(e.key==='ArrowDown')L.y+=d;schedule();clearTimeout(S.nt);S.nt=setTimeout(()=>commit('Nudge'),400)}return}
  if(e.key==='[')S.brush.size=Math.max(1,S.brush.size-(S.brush.size>50?10:4));if(e.key===']')S.brush.size=Math.min(400,S.brush.size+(S.brush.size>=50?10:4));
  if(e.key==='['||e.key===']'){renderOpts();drawOverlay();return}
  if(e.key==='\\'){if(!e.repeat)setCompare(true);return}
  if(e.key==='?'){helpDialog();return}
  if(/^[0-9]$/.test(e.key)&&!mod&&!e.altKey){const L=activeLayer();if(L){L.opacity=e.key==='0'?1:(+e.key)/10;commit('Opacity '+Math.round(L.opacity*100)+'%');renderPanel()}return}
  if(e.key==='+'||e.key==='='){zoomCenter(1.25);return}if(e.key==='-'){zoomCenter(1/1.25);return}if(e.key==='0'){fitZoom();return}
  const k=e.key.toLowerCase();
  if(k==='x'){swap();return}
  if(k==='q'){const L=activeLayer();if(L&&L.mask){L.maskEdit=!L.maskEdit;renderPanel();renderOpts()}return}
  const map={v:'move',c:'crop',m:'rect',o:'ellipse',l:'lasso',w:'wand',b:'brush',e:'eraser',g:'bucket',r:'gradient',s:'clone',j:'heal',d:'tone',k:'smudge',i:'eyedrop',t:'text',u:'shape',h:'hand',y:'liquify',z:'redeye',n:'magiceraser'};
  if(map[k]&&!mod&&!e.altKey){setTool(map[k])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('keyup',e=>{if(e.key==='\\')setCompare(false);if(e.key===' '){S.space=false;ov.style.cursor=S.tool==='hand'?'grab':'crosshair'}});

buildTools();renderTabs();setTool('move');startSample();sizeBoard(true);

window.__grainroom={S,commit,render,addTextLayer,exportDialog,setTool,setSelMask,maskFull,maskFromGeom,selAction,invertSel,growSel,shrinkSel,featherSel,selectAll,deselect,combineMask,flipLayer,flipCanvas,serializeDoc,loadDoc,FILTERS,runAdjust,autoTone,copySel,pasteInternal,layerViaCopy,magicWand,newLayer,insertLayer,composeLayers,newDoc,resetDoc,mkCanvas,proc,activeLayer,fitLayer,alignLayer,filterDialog,xfHit,startXf,xfDrag,undo,redo,snapPos,selectLayerPixels,saveProject,helpDialog,frameDialog,addAssetShape,addSticker,addBackground,redEye,magicEraser,setCompare,LOOKS,applyTextPreset,addTextStyle,shapeCanvas,renderText};
